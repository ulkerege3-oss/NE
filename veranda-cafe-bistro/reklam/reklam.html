<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gloock&family=Karla:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  /* Reklam düzeni: render tam kadraj, metin sol-alt köşede koyu geçiş üzerinde.
     ?format=yatay (1920×1080) veya ?format=dikey (1080×1350) */
  :root {
    --night: 14, 22, 32;
    --cream: #F4EEE2;
    --brass: #E2B66E;
    --font-display: "Gloock", Georgia, serif;
    --font-body: "Karla", "Helvetica Neue", Arial, sans-serif;
    --font-mono: "IBM Plex Mono", Menlo, monospace;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { background: #0E1620; }
  .ad {
    position: relative;
    overflow: hidden;
    color: var(--cream);
    font-family: var(--font-body);
  }
  .ad img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .shade { position: absolute; inset: 0; }
  .copy { position: absolute; display: grid; }
  .brand { display: flex; align-items: baseline; gap: 0.5em; }
  .brand b {
    font-family: var(--font-display); font-weight: 400;
    letter-spacing: 0.02em;
  }
  .brand span {
    font-family: var(--font-mono); text-transform: uppercase;
    letter-spacing: 0.32em; color: var(--brass);
  }
  h1 { font-family: var(--font-display); font-weight: 400; line-height: 1.02; letter-spacing: -0.01em; }
  .sub { color: rgba(244, 238, 226, 0.86); line-height: 1.45; }
  .meta {
    display: flex; flex-wrap: wrap; align-items: center;
    font-family: var(--font-mono); text-transform: uppercase; letter-spacing: 0.14em;
    color: rgba(244, 238, 226, 0.78);
  }
  .meta i { width: 4px; height: 4px; border-radius: 50%; background: var(--brass); display: inline-block; }
  .cta {
    justify-self: start;
    border: 1px solid var(--brass); color: var(--brass);
    font-family: var(--font-mono); text-transform: uppercase; letter-spacing: 0.2em;
  }
  .tag {
    position: absolute;
    font-family: var(--font-mono); text-transform: uppercase; letter-spacing: 0.24em;
    color: rgba(244, 238, 226, 0.7);
  }

  /* Yatay 1920×1080 */
  .yatay { width: 1920px; height: 1080px; }
  .yatay .shade {
    background:
      linear-gradient(90deg, rgba(var(--night), 0.88) 0%, rgba(var(--night), 0.55) 30%, rgba(var(--night), 0) 55%),
      linear-gradient(0deg, rgba(var(--night), 0.75) 0%, rgba(var(--night), 0) 45%);
  }
  .yatay .copy { left: 96px; bottom: 92px; gap: 28px; max-width: 760px; }
  .yatay .brand b { font-size: 46px; }
  .yatay .brand span { font-size: 16px; }
  .yatay h1 { font-size: 112px; }
  .yatay .sub { font-size: 27px; max-width: 30ch; }
  .yatay .meta { font-size: 17px; gap: 14px 22px; }
  .yatay .cta { font-size: 16px; padding: 16px 26px; margin-top: 8px; }
  .yatay .tag { right: 64px; bottom: 52px; font-size: 13px; }

  /* Dikey 1080×1350 */
  .dikey { width: 1080px; height: 1350px; }
  .dikey .shade {
    background:
      linear-gradient(0deg, rgba(var(--night), 0.94) 0%, rgba(var(--night), 0.7) 30%, rgba(var(--night), 0) 58%),
      linear-gradient(180deg, rgba(var(--night), 0.55) 0%, rgba(var(--night), 0) 18%);
  }
  .dikey .copy { left: 72px; right: 72px; bottom: 76px; gap: 24px; }
  .dikey .brand { display: none; }
  .dikey .top-brand { position: absolute; top: 64px; left: 72px; display: flex; align-items: baseline; gap: 0.5em; }
  .dikey .top-brand b { font-family: var(--font-display); font-weight: 400; font-size: 44px; }
  .dikey .top-brand span { font-family: var(--font-mono); font-size: 15px; letter-spacing: 0.32em; text-transform: uppercase; color: var(--brass); }
  .dikey h1 { font-size: 104px; }
  .dikey .sub { font-size: 27px; max-width: 32ch; }
  .dikey .meta { font-size: 16px; gap: 12px 20px; }
  .dikey .cta { font-size: 15px; padding: 15px 24px; }
  .dikey .tag { display: none; }
  .yatay .top-brand { display: none; }
</style>
</head>
<body>
<div class="ad" id="ad">
  <img id="render" alt="">
  <div class="shade"></div>
  <div class="top-brand"><b>Veranda</b><span>Café · Bistro</span></div>
  <div class="copy">
    <div class="brand"><b>Veranda</b><span>Café · Bistro</span></div>
    <h1>Bahçe içeri<br>taşınıyor.</h1>
    <p class="sub">Sabah asmanın gölgesinde kahve, akşam festoon ışıkları altında bistro.</p>
    <div class="meta"><span>Her gün 08:00–24:00</span><i></i><span>Kahvaltı</span><i></i><span>Kahve</span><i></i><span>Bistro</span></div>
    <span class="cta">Masanızı ayırtın</span>
  </div>
  <div class="tag">Ege usulü veranda · 65 kişilik</div>
</div>
<script>
  const f = new URLSearchParams(location.search).get("format") || "yatay";
  document.getElementById("ad").classList.add(f);
  document.getElementById("render").src = f === "dikey" ? "veranda-render-dikey.jpg" : "veranda-render.jpg";
</script>
</body>
</html>
